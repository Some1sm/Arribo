services:
  arribo:
    # The deploy workflow builds this tag from the repository and copies only
    # this file to the server; `build: .` is for running from a checkout.
    image: arribo-arribo:latest
    build: .
    container_name: arribo
    restart: unless-stopped
    stop_grace_period: 15s
    # The app runs as a non-root user (uid 1000) on port 3000 and needs no Linux
    # capabilities; nothing in the container may regain privileges either.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TZ=Europe/Madrid
      - ORS_BASE_URL=${ORS_BASE_URL:-}
      - ORS_API_KEY=${ORS_API_KEY:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Go runtime memory: collect when the heap grows 50% past the live data
      # (the default is 100%; CPU is cheap here, RAM is not), and treat 128 MiB
      # as a soft ceiling. Measured: ~55 MiB idle, ~120 MiB with every cache full.
      - GOGC=50
      - GOMEMLIMIT=128MiB
      # Storage controls for the persistent SQLite flight recorder
      - SNAPSHOT_RETENTION_HOURS=6
      - VEHICLE_SNAPSHOT_INTERVAL_MS=60000
      - DELAY_RETENTION_DAYS=30
      # Rodalies and FGC: poll their GTFS-RT feeds, import their timetables
      # daily into ./data/gtfs/ (~60 MB) and record train station visits for
      # the Dades "Trens" section. Measured ~36 MiB with it on. 0 to turn off.
      - ARRIBO_GTFSRT=${ARRIBO_GTFSRT:-1}
      # Moventis buses (moventis.es arrival predictions, see app/moventis.go)
      - ARRIBO_MOVENTIS=${ARRIBO_MOVENTIS:-1}
      # AMB Bus Metropolità (open trip updates, no positions; app/amb.go). Needs ARRIBO_GTFSRT.
      - ARRIBO_AMB=${ARRIBO_AMB:-1}
      # TRAM Barcelona Trambaix + Trambesòs (OAuth GTFS-RT trip updates, no history; app/tram.go). Needs ARRIBO_GTFSRT + TRAM_CLIENT_*.
      - ARRIBO_TRAM=${ARRIBO_TRAM:-1}
      # TMB Metro + Bus (iTransit live predictions + static GTFS, no history; app/tmb.go). Needs ARRIBO_GTFSRT + TMB_APP_*.
      - ARRIBO_TMB=${ARRIBO_TMB:-1}
      # Sagalés real GPS + delays (sagales.com unofficial; app/sagales.go).
      - ARRIBO_SAGALES=${ARRIBO_SAGALES:-1}
      # TMG Girona static GTFS (NAP 1570) + unofficial live appbus predictions (app/girona.go). Needs ARRIBO_GTFSRT + NAP_API_KEY.
      - ARRIBO_GIRONA=${ARRIBO_GIRONA:-1}
      # Renfe unofficial web-map visors (flota.json / flotaLD.json: platforms, LD units, wheelchair; app/renfemap.go).
      - ARRIBO_RENFE_MAP=${ARRIBO_RENFE_MAP:-1}
      # Optional API keys from host .env (never committed; used by upcoming TMB/TRAM/NAP integrations)
      - TMB_APP_ID=${TMB_APP_ID:-}
      - TMB_APP_KEY=${TMB_APP_KEY:-}
      - TRAM_CLIENT_ID=${TRAM_CLIENT_ID:-}
      - TRAM_CLIENT_SECRET=${TRAM_CLIENT_SECRET:-}
      - NAP_API_KEY=${NAP_API_KEY:-}
    ulimits:
      core:
        soft: 0
        hard: 0
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 80M
    healthcheck:
      test: ["CMD", "/app/arribo", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
