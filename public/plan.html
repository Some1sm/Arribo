<!DOCTYPE html>
<html lang="ca" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Com anar-hi a Mataró — Planificador de Rutes | Arribo!</title>
  <meta name="description" content="Planificador de viatges i connexions d'autobús urbà i Rodalies a Mataró. Descobreix la millor ruta directa o amb transbordament.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/css/style.css?v=6.0.10">
  <style>
    /* Dedicated Full-Page Planner Layout */
    body.planner-page-body {
      margin: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg-body, #0a0e17);
      color: var(--text-primary, #f1f5f9);
      font-family: var(--font-main, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
    }

    .plan-header {
      height: 56px;
      background: var(--bg-surface-elevated, #111827);
      border-bottom: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.1));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      flex-shrink: 0;
      z-index: 1000;
    }

    .plan-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-primary, #fff);
      font-weight: 800;
      font-size: 1.15rem;
    }

    .plan-main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Sidebar / Search Column */
    .plan-sidebar {
      width: 420px;
      max-width: 100%;
      height: 100%;
      background: var(--bg-surface, #0f172a);
      border-right: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.1));
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 500;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
    }

    .plan-search-box {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.1));
      background: var(--bg-surface-elevated, #1a2337);
      flex-shrink: 0;
    }

    .plan-results-area {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Full-screen Map */
    .plan-map-view {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #plan-map {
      width: 100%;
      height: 100%;
      background: #0f172a;
    }

    /* Preset Hub Chips */
    .plan-presets {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      margin-top: 0.75rem;
      padding-bottom: 4px;
    }

    .plan-preset-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.15));
      border-radius: 12px;
      color: var(--text-secondary, #94a3b8);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .plan-preset-chip:hover {
      background: rgba(14, 165, 233, 0.2);
      color: #38bdf8;
      border-color: rgba(14, 165, 233, 0.4);
    }

    .plan-itinerary-active {
      border: 2px solid #38bdf8 !important;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35) !important;
    }

    /* Mobile Sheet & Controls */
    .plan-sheet-bar {
      display: none;
    }

    .plan-trip-summary {
      display: none;
    }

    .btn-floating-routes {
      display: none;
    }

    .plan-results-wrapper {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .plan-results-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }

    .plan-scroll-hint {
      display: none;
    }

    /* Responsive Mobile adjustments */
    @media (max-width: 768px) {
      .plan-main-container {
        flex-direction: column-reverse;
      }

      .plan-sheet-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8px 12px 6px 12px;
        background: var(--bg-surface-elevated, #1a2337);
        border-bottom: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.1));
        cursor: pointer;
        user-select: none;
        flex-shrink: 0;
        touch-action: none;
      }

      .sheet-drag-pill {
        width: 38px;
        height: 4.5px;
        background: rgba(255, 255, 255, 0.35);
        border-radius: 3px;
        margin-bottom: 7px;
      }

      .sheet-view-toggles {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        justify-content: center;
      }

      .sheet-toggle-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.15));
        border-radius: 14px;
        color: var(--text-secondary, #94a3b8);
        font-size: 0.76rem;
        font-weight: 600;
        padding: 4px 10px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: all 0.15s ease;
      }

      .sheet-toggle-btn.active {
        background: #0284c7;
        color: #ffffff;
        border-color: #38bdf8;
      }

      .plan-sidebar {
        width: 100%;
        height: 55%;
        border-right: none;
        border-top: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.15));
        box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.65);
        transition: height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
      }

      /* Sheet Snap Heights */
      .plan-sidebar.sheet-peek {
        height: 125px !important;
      }

      .plan-sidebar.sheet-split {
        height: 55% !important;
      }

      .plan-sidebar.sheet-expanded {
        height: 88% !important;
      }

      .plan-map-view {
        height: 100%;
        flex: 1;
        position: relative;
      }

      .plan-search-box {
        padding: 0.65rem 0.85rem;
      }

      .plan-trip-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.15));
        border-radius: 10px;
        padding: 6px 10px;
        gap: 8px;
      }

      .trip-summary-content {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }

      .trip-summary-line {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        flex: 1;
      }

      .trip-summary-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .trip-summary-dot.dot-origin {
        background: #10b981;
      }

      .trip-summary-dot.dot-dest {
        background: #ef4444;
      }

      .trip-summary-text {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .trip-summary-arrow {
        color: var(--text-muted);
        font-size: 0.8rem;
        flex-shrink: 0;
      }

      .btn-trip-edit {
        background: rgba(14, 165, 233, 0.18);
        border: 1px solid rgba(56, 189, 248, 0.35);
        color: #38bdf8;
        border-radius: 8px;
        padding: 4px 8px;
        font-size: 0.75rem;
        font-weight: 700;
        cursor: pointer;
        flex-shrink: 0;
      }

      .btn-floating-routes {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: #0284c7;
        color: #ffffff;
        border: none;
        border-radius: 24px;
        padding: 8px 18px;
        font-size: 0.88rem;
        font-weight: 700;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      .btn-floating-routes:active {
        transform: translateX(-50%) scale(0.96);
      }

      .floating-routes-badge {
        background: rgba(255, 255, 255, 0.25);
        padding: 1px 6px;
        border-radius: 10px;
        font-size: 0.75rem;
      }

      .plan-results-area {
        padding: 0.75rem;
        padding-bottom: 3.5rem; /* Generous padding so bottom cards are never cut off */
      }

      .plan-scroll-hint {
        display: flex;
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 3px 10px;
        font-size: 0.72rem;
        color: var(--text-muted);
        pointer-events: none;
        backdrop-filter: blur(8px);
        z-index: 10;
        transition: opacity 0.3s ease;
      }
    }
  </style>
</head>
<body class="planner-page-body">
  <!-- Top Navigation Bar -->
  <header class="plan-header">
    <a href="/" class="plan-logo" title="Tornar al visor complet d'Arribo!">
      <span style="font-size:1.3rem;">🚌</span>
      <span>Arribo!</span>
      <span style="font-size:0.75rem; font-weight:600; background:rgba(14,165,233,0.2); color:#38bdf8; padding:2px 6px; border-radius:4px; margin-left:4px;">Rutes</span>
    </a>

    <div style="display:flex; align-items:center; gap:8px;">
      <a href="/" class="btn-itinerary-back" style="text-decoration:none;">
        <span>🗺️</span>
        <span>Mapa general</span>
      </a>
      <button type="button" class="btn-icon btn-theme-toggle" id="btn-page-theme-toggle" title="Canviar tema" style="background:transparent; border:none; font-size:1.1rem; cursor:pointer;">
        🌓
      </button>
    </div>
  </header>

  <main class="plan-main-container">
    <!-- Left Sidebar: Search & Results -->
    <aside class="plan-sidebar sheet-split" id="plan-sidebar">
      <!-- Mobile Sheet Drag Handle & View Switcher -->
      <div class="plan-sheet-bar" id="plan-sheet-bar" title="Arrossega o prem per canviar mida">
        <div class="sheet-drag-pill" id="sheet-drag-pill"></div>
        <div class="sheet-view-toggles">
          <button type="button" class="sheet-toggle-btn" id="btn-sheet-map" title="Veure mapa ampliat">
            <span>🗺️ Mapa</span>
          </button>
          <button type="button" class="sheet-toggle-btn active" id="btn-sheet-split" title="Vista dividida">
            <span>⚖️ Mig</span>
          </button>
          <button type="button" class="sheet-toggle-btn" id="btn-sheet-routes" title="Veure rutes a pantalla completa">
            <span id="label-sheet-routes">📋 Rutes</span>
          </button>
        </div>
      </div>

      <div class="plan-search-box" id="plan-search-box">
        <!-- Compact Summary Header (displayed after search on mobile) -->
        <div class="plan-trip-summary" id="plan-trip-summary" style="display:none;">
          <div class="trip-summary-content" id="btn-expand-search" role="button" tabindex="0" title="Prem per modificar origen o destinació">
            <div class="trip-summary-line">
              <span class="trip-summary-dot dot-origin"></span>
              <span class="trip-summary-text" id="trip-summary-from">Origen</span>
            </div>
            <div class="trip-summary-arrow">➔</div>
            <div class="trip-summary-line">
              <span class="trip-summary-dot dot-dest"></span>
              <span class="trip-summary-text" id="trip-summary-to">Destinació</span>
            </div>
          </div>
          <button type="button" class="btn-trip-edit" id="btn-trip-edit" title="Modificar adreces">
            <span>✏️ Canviar</span>
          </button>
        </div>

        <!-- Full Search Form -->
        <div class="plan-search-form" id="plan-search-form">
          <div class="planner-form-container" style="padding:0; background:transparent; border:none; box-shadow:none;">
            <!-- Origin Input -->
            <div class="planner-input-group" style="margin-bottom:0.6rem;">
              <label class="planner-label" for="page-planner-origin">
                <span class="planner-dot dot-origin"></span>
                <span>ORIGEN:</span>
              </label>
              <div class="planner-input-wrapper">
                <input type="text" id="page-planner-origin" class="planner-input" placeholder="Parada d'origen (ex: Roca Blanca)" autocomplete="off">
                <button type="button" class="btn-planner-geo btn-planner-gps" id="btn-page-planner-gps" title="Utilitzar la meva ubicació actual">
                  <span>📍 GPS</span>
                </button>
              </div>
              <div id="page-planner-origin-dropdown" class="planner-dropdown" style="display:none;"></div>
            </div>

            <!-- Swap Button -->
            <div style="display:flex; justify-content:center; margin:-6px 0 2px 0;">
              <button type="button" class="btn-planner-swap" id="btn-page-planner-swap" title="Intercanviar origen i destinació">
                <span>⇅</span>
              </button>
            </div>

            <!-- Destination Input -->
            <div class="planner-input-group" style="margin-bottom:0.75rem;">
              <label class="planner-label" for="page-planner-dest">
                <span class="planner-dot dot-dest"></span>
                <span>DESTINACIÓ:</span>
              </label>
              <div class="planner-input-wrapper">
                <input type="text" id="page-planner-dest" class="planner-input" placeholder="Parada de destí (ex: Rodalies)" autocomplete="off">
              </div>
              <div id="page-planner-dest-dropdown" class="planner-dropdown" style="display:none;"></div>
            </div>

            <!-- Search Button -->
            <button type="button" class="btn-planner-search" id="btn-page-planner-search" style="padding:0.7rem; font-size:0.92rem;">
              <span>🔍 Cercar la millor ruta</span>
            </button>

            <!-- Quick Presets -->
            <div class="plan-presets">
              <span style="font-size:0.7rem; color:var(--text-muted); font-weight:700;">DESTINACIONS:</span>
              <button type="button" class="plan-preset-chip" data-stop="Hospital de Mataró">🏥 Hospital</button>
              <button type="button" class="plan-preset-chip" data-stop="Estació Rodalies">🚆 Rodalies</button>
              <button type="button" class="plan-preset-chip" data-stop="Mataró Parc">🛍️ Mataró Parc</button>
              <button type="button" class="plan-preset-chip" data-stop="Pl. de les Tereses">🏛️ Pl. Tereses</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Results List Wrapper -->
      <div class="plan-results-wrapper">
        <div class="plan-results-area" id="page-planner-results">
          <div style="text-align:center; padding:3rem 1rem; color:var(--text-secondary);">
            <div style="font-size:2.5rem; margin-bottom:0.75rem;">🧭</div>
            <div style="font-weight:700; font-size:1rem; color:var(--text-primary); margin-bottom:0.35rem;">On vols anar a Mataró?</div>
            <div style="font-size:0.85rem; line-height:1.4;">Introdueix una parada d'origen i una de destinació per calcular la combinació més ràpida de bus.</div>
          </div>
        </div>
        <div class="plan-scroll-hint" id="plan-scroll-hint">
          <span>↕ Llisca per veure totes les opcions</span>
        </div>
      </div>
    </aside>

    <!-- Right Area: Interactive Leaflet Map -->
    <section class="plan-map-view" aria-label="Visualització del mapa del trajecte">
      <div id="plan-map"></div>
      <button type="button" class="btn-floating-routes" id="btn-floating-routes" title="Veure llistat de rutes">
        <span>📋 Veure rutes</span>
        <span class="floating-routes-badge" id="floating-routes-badge"></span>
      </button>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/js/map.js?v=6.0.7"></script>
  <script src="/js/plan.js?v=6.0.16"></script>
</body>
</html>
