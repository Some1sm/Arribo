services:
  arribo:
    build: .
    container_name: arribo
    restart: unless-stopped
    stop_grace_period: 15s
    # The app runs as a non-root user (uid 1000) on port 3000 and needs no Linux
    # capabilities; nothing in the container may regain privileges either.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TZ=Europe/Madrid
      - ORS_BASE_URL=${ORS_BASE_URL:-}
      - ORS_API_KEY=${ORS_API_KEY:-}
      # Go runtime memory: collect when the heap grows 50% past the live data
      # (the default is 100%; CPU is cheap here, RAM is not), and treat 128 MiB
      # as a soft ceiling. Measured: ~55 MiB idle, ~120 MiB with every cache full.
      - GOGC=50
      - GOMEMLIMIT=128MiB
      # Storage controls for the persistent SQLite flight recorder
      - SNAPSHOT_RETENTION_HOURS=6
      - VEHICLE_SNAPSHOT_INTERVAL_MS=60000
      - DELAY_RETENTION_DAYS=30
    ulimits:
      core:
        soft: 0
        hard: 0
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 80M
    healthcheck:
      test: ["CMD", "/app/arribo", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
