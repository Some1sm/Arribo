services:
  arribo:
    build: .
    container_name: arribo
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Europe/Madrid
      - ORS_BASE_URL=${ORS_BASE_URL:-}
      - ORS_API_KEY=${ORS_API_KEY:-}
      - NODE_OPTIONS=--max-old-space-size=160 --expose-gc
      # Storage controls for the persistent SQLite flight recorder
      - SNAPSHOT_RETENTION_HOURS=2
      - VEHICLE_SNAPSHOT_INTERVAL_MS=60000
      - DELAY_RETENTION_DAYS=30
    ulimits:
      core:
        soft: 0
        hard: 0
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 80M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
