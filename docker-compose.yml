services:
  bus-tracker:
    build: .
    container_name: bad-amb-bus-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Europe/Madrid
      - NODE_OPTIONS=--max-old-space-size=256
      # Storage controls for the persistent SQLite flight recorder
      - SNAPSHOT_RETENTION_HOURS=2
      - VEHICLE_SNAPSHOT_INTERVAL_MS=60000
      - DELAY_RETENTION_DAYS=30
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 80M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./data:/app/data
